  # Every one of them is switched OFF below until the owner joins it and checks the brief.
  # Each campaign's caption/hook/platform rules are applied automatically.
  # After a campaign clip posts, the review issue gets a "SUBMIT NOW" comment:
  # links must be submitted on contentrewards.com within 30 minutes.

  - id: cr_tomo
    platform: youtube_channel
    streamer: "Tomo"
    youtube_channel: "https://www.youtube.com/@Tomovids/streams"
    title_must_include: ["gta"]           # GTA VI streams only
    title_must_exclude: ["trailer", "reaction"]   # campaign wants GTA VI gameplay
    milestone:                            # brief: proof of audience at 2K views
      views: 2000
      task: |
        In YouTube Studio open this video → Analytics → Audience, screenshot it,
        and post it in the TOMO campaign Discord. Keep likes visible and leave
        the clip up for at least 30 days.
    footage_after: "2026-11-18T00:00:00-05:00"
    link: "youtube.com/@Tomovids"
    permission: campaign
    campaign: "TOMO GTA VI Clipping"
    campaign_url: "https://contentrewards.com/c/campaigns/df6de26f-86ec-4782-b818-1fc8053b99a4"
    rate_per_1k_usd: 2.00
    platforms_allowed: [youtube, tiktok, instagram]
    credit_template: "Subscribe to Tomo on YouTube → @Tomovids"
    hashtags: ["#tomovids", "#gta6"]
    hooks:                                # brief bans misleading / fake-context hooks
      - "Tomo plays GTA 6"
      - "Tomo's GTA 6 reaction"
      - "Tomo in Vice City"
    longform: true
    enabled: false   # switched off 2026-11-21: the upstream author joined this campaign, not you. Flip to true only after you join it.

