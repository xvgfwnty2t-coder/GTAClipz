# ── Game / discovery ────────────────────────────────────────────────────────
game:
  twitch_game_name: "Grand Theft Auto VI"
  twitch_game_id: "1867279146"   # Grand Theft Auto VI, confirmed 2026-11-17
  youtube_query: "GTA 6 gameplay"

discovery:
  lookback_hours: 6         # launch week: drop to 3, the firehose is dense
  max_candidates: 120
  per_source_cap: 15        # don't let one streamer dominate a day's output

# ── Scoring: which clips are worth rendering ───────────────────────────────
# score = views-per-hour × duration-fit × title-signal
scoring:
  duration_sweet_spot: [15, 45]    # seconds
  title_boost_keywords:
    - "first"
    - "wtf"
    - "no way"
    - "insane"
    - "glitch"
    - "secret"
    - "easter egg"
    - "how did"
    - "rip"
    - "fail"
  # Rockstar removes all of these. Rendering one spends a slot on a takedown.
  title_penalty_keywords:
    - "ending"
    - "final mission"
    - "cutscene"        # isolated cinematics get removed
    - "full story"
    - "spoiler"
    - "leak"
    - "mod menu"        # cheat / mod content is explicitly prohibited
    - "money glitch"
  # GTA radio plays REAL licensed tracks owned by labels, not by Rockstar.
  # A clip that is mostly radio music draws a Content ID claim and the revenue
  # goes to the label. Clips where the streamer is TALKING are better on two
  # counts: Whisper has something to caption, and speech masks the radio.
  music_risk_keywords:
    - "radio"
    - "song"
    - "singing"
    - "banger"

# ── Render ────────────────────────────────────────────────────────────────
render:
  width: 1080
  height: 1920
  fps: 30
  budget_s: 1080            # stop rendering after 18 min so posting still runs
  video_bitrate: "6M"
  audio_bitrate: "160k"
  layout: "blur_pad"        # blur_pad | center_crop | gameplay_top
  loudnorm: true            # -14 LUFS, matches platform targets
  hook_card:
    enabled: true
    duration: 1.2
    # Graphic violence inside the first 7s is NOT ad-eligible on YouTube.
    # The hook card exists partly to push gameplay past that boundary.
  captions:
    enabled: true
    model: "small.en"       # A: fewer misheard words than base.en (~2x slower)
    vocabulary: ["Vice City", "Leonida", "Lucia", "Jason", "chat", "GTA", "Lacy",
                 "Clix", "JasonTheWeen", "Tomo", "Bobby", "Marlon", "Stable Ronaldo"]
    style: "karaoke"        # B: word-by-word, current word highlighted
    font: "Anton"           # heavy display font (installed by the workflow)
    font_size: 92
    highlight_colour: "&H0000E5FF"   # yellow (ASS colours are BGR)
    max_words: 3
    max_chars_per_line: 18
    y_position: 0.68        # used only when no layout-specific spot exists
  watermark:
    enabled: true
    text: "@gtavicecityclipzz"   # your own branding is fine and does NOT hurt reach
    opacity: 0.55

# ── Safety gates (hard stops, not suggestions) ────────────────────────────
safety:
  require_permission: true          # refuse to publish permission: none
  block_first_7s_graphic: true      # YouTube ad-eligibility boundary
  strip_source_watermarks: true     # another platform's logo kills reach
  skip_if_phash_seen: true          # never post the same moment twice
  max_posts_per_platform_per_day:
    youtube: 15
    tiktok: 10
    instagram: 15

# ── Publishing ────────────────────────────────────────────────────────────
publish:
  approved_max_age_h: 48    # approved clips not posted within 48h are dropped (stale)
  near_dup_s: 240           # two approved clips <4 min apart in one stream: keep the better one
  youtube:
    enabled: true
    privacy: "public"
    category_id: "20"       # Gaming
    made_for_kids: false
  instagram:
    enabled: true
    share_to_feed: true
    ig_user_id: "17841449744252978"   # @gtavicecityclipzz — public ID, not a secret
  tiktok:
    enabled: true
    # chrome      = the hourly Claude task posts it from Chrome at tiktok.com
    #               WITH the full caption + campaign tag (src/tiktok_queue.py)
    # inbox_draft = API drop into the TikTok inbox; you add the caption by hand
    # direct_post = needs TikTok's audit
    # Switched to "chrome" automatically by the hourly Claude task the first
    # time it runs with the TikTok-posting instructions.
    mode: "chrome"
  # "SUBMIT NOW" phone pings: on while you post TikToks by hand (inbox_draft),
  # off in chrome mode (Claude posts + submits). Set true/false to override.
  # submit_now_alerts: true
  # Campaign clips only go live when you can submit the link within 30 min.
  # Approved clips wait (in order) until the window opens. Edit to your day.
  campaign_hours:
    timezone: "America/New_York"
    start: "08:00"
    end: "23:00"
  # Campaign clips post only in this slice of each hour; the submit task in
  # your Chrome runs at :41, so every link is <30 min old when it's submitted.
  campaign_minutes: [20, 35]
  campaign_clips_per_hour: 3
  # Stagger rather than dump: looks human, spreads the test across the day
  schedule_offsets_minutes: [0, 95, 190, 310, 430, 560, 700, 840]

storage:
  r2_bucket: "gta6-clips"
  r2_public_base: ""   # EMPTY on purpose (2026-11-21): no Cloudflare. It used to be the upstream author bucket; with it set, a run crashed after the 1st clip because the R2 keys are missing.
  keep_renders_days: 3

# ── Production brake ──────────────────────────────────────────────────
production:
  backlog_brake: 20         # stop making clips while 20+ are approved/awaiting review

# ── Long-form clipper (VOD -> moments) ────────────────────────────────────
longform:
  enabled: true
  max_vods_per_run: 3
  max_chunk_s: 14400        # scan at most 4h of a VOD per run (chat download time)
  vod_budget_s: 600         # give up on one VOD after 10 min (it hung a cycle once)
  stage_budget_s: 900       # all long-form work per cycle (15 min); posting runs after
  max_clips_per_run: 8      # cut only what one cycle can render (raw cuts don't carry over)
  min_chunk_s: 600          # don't bother scanning <10 min of new footage
  live_margin_s: 300        # stay 5 min behind the live edge of a growing VOD
  min_chat_messages: 200    # below this, chat is too thin -> audio fallback
  chat_min_ratio: 3.0       # a bin must be 3x the trailing 5-min median
  max_moments_per_chunk: 12
  max_clips_per_chunk: 2    # publish lane: only the best 2 moments per VOD chunk
  min_score: 20             # drop clips scoring under this (your approvals: 53% -> 62%)
  extra_tries: 3            # spare moments to try when some fall under min_score
  pre_roll_s: 40            # chat reacts late; start the clip before the spike (was 30)
  clip_len_s: 120           # was 45: peaks were cut off (2026-11-21). Trim it yourself.
  max_len_s: 150            # hard ceiling per clip (the code used to force 59)
  skip_first_s: 1800        # ignore the first 30 min of a VOD (intro / just chatting)

# ── Scouting lane (no permission yet -> proof clips for outreach) ─────────
scouting:
  enabled: true             # ON for the quality test (2026-11-21): scout clips are never published
  clips_per_streamer_per_day: 4   # was 2; raised for the 2026-11-21 test (the day limit resets at 00:00 UTC = 02:00 Greek time)
  auto_discover: false      # OFF: only clip streams we're allowed to post
  auto_discover_top: 5
  r2_prefix: "scout/"       # proof clips uploaded here so you can link them in DMs

# ── Approval queue (week one: you approve; then it learns your taste) ─────
review:
  mode: "manual"            # manual | auto
  auto_switch_after: "2026-11-25"   # switch to auto on this date IF...
  min_decisions: 40                 # ...you've made at least this many decisions
  target_approval_rate: 0.80        # auto threshold = where you approved >=80%
  expire_hours: 36          # unanswered clips expire (stale by then anyway)
  issue_label: "clip-review"
