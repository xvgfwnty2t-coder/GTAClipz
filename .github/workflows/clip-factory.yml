name: GTA6 Clip Factory

# Heartbeat: GitHub's cron is best-effort and often skips runs, so each "run"
# chains the next one itself (~15 min apart). Between full cycles it checks
# your ✅ ticks every ~2.5 min and posts approved clips right away.
# The cron below is only a safety net that restarts the chain if it breaks.
on:
  schedule:
    - cron: "7,37 * * * *"      # off the :00/:30 rush hour, UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "run | approve | status | kicktest | r2test | twitchtest | igtest | yttest | tiktoktest | e2etest | discover | vods | longform | download | render | review | publish"
        default: "run"

permissions:
  contents: write      # commit the state ledger back
  issues: write        # the daily clip-review issue
  actions: write       # lets a run start the next one (the heartbeat)

concurrency:
  group: clip-factory          # never let two runs fight over state
  cancel-in-progress: false

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TWITCH_CLIENT_ID:      ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET:  ${{ secrets.TWITCH_CLIENT_SECRET }}
      IG_USER_ID:            ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN:       ${{ secrets.IG_ACCESS_TOKEN }}
      TIKTOK_CLIENT_KEY:     ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET:  ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN:  ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      R2_ACCOUNT_ID:         ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID:      ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY:  ${{ secrets.R2_SECRET_ACCESS_KEY }}
      GITHUB_TOKEN:          ${{ github.token }}   # review issues; built in, no setup
      MODE: ${{ inputs.mode || 'run' }}
      CYCLE_SECONDS: "900"   # full cycle every ~15 min
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install TwitchDownloaderCLI (chat replays for the long-form clipper)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R lay295/TwitchDownloader -p '*Linux-x64.zip' -D /tmp/tdl
          mkdir -p "$HOME/bin" && unzip -oq /tmp/tdl/*.zip -d "$HOME/bin"
          chmod +x "$HOME/bin/TwitchDownloaderCLI"
          echo "TDCLI=$HOME/bin/TwitchDownloaderCLI" >> "$GITHUB_ENV"

      - name: Install deps
        run: |
          pip install -q -r requirements.txt
          mkdir -p ~/.fonts
          curl -sfL -o ~/.fonts/Anton-Regular.ttf \
            https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf \
            && fc-cache -f >/dev/null || echo "Anton font download failed; captions fall back to DejaVu"

      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-en-v1

      - name: Restore YouTube token
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          mkdir -p state
          printf '%s' "$YT_TOKEN_JSON" > state/youtube_token.json

      - name: Run pipeline
        timeout-minutes: 50
        run: |
          echo "START=$(date +%s)" >> "$GITHUB_ENV"
          python src/pipeline.py "$MODE"

      - name: Persist state
        if: always()
        run: cp scripts/persist.sh /tmp/persist.sh && bash /tmp/persist.sh

      - name: Quick approvals until the next cycle
        if: env.MODE == 'run' && !cancelled()
        run: |
          while [ $(( $(date +%s) - START + 150 )) -lt "$CYCLE_SECONDS" ]; do
            sleep 150
            python src/pipeline.py approve || true
            bash /tmp/persist.sh
          done

      - name: Start the next cycle
        if: env.MODE == 'run' && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/clip-factory.yml/dispatches" \
            -f ref=main -f "inputs[mode]=run" && echo "next cycle queued"

      - name: Upload rendered clips for inspection (test)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: work/out/
          retention-days: 2
